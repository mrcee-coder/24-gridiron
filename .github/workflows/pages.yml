name: Publish 24 Gridiron Preview

on:
  push:
    branches:
      - main
      - feature/homepage-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify official completed 2026 Sleeper draft
        run: |
          node <<'NODE'
          const fs = require('fs');
          const API = 'https://api.sleeper.app/v1';
          const LEAGUE = '1395507776981069824';
          async function get(path){
            const r = await fetch(API + path);
            if(!r.ok) throw new Error(`${path} -> ${r.status}`);
            return r.json();
          }
          (async()=>{
            const [users,drafts] = await Promise.all([
              get(`/league/${LEAGUE}/users`),
              get(`/league/${LEAGUE}/drafts`)
            ]);
            const draft = (drafts||[]).find(d=>String(d.season)==='2026');
            if(!draft) throw new Error('No official 2026 Sleeper draft found');
            const picks = await get(`/draft/${draft.draft_id}/picks`);
            const orderCount = Object.keys(draft.draft_order||{}).length;
            if(users.length !== 12) throw new Error(`Expected 12 league users, found ${users.length}`);
            if(orderCount !== 12) throw new Error(`Expected 12 draft slots, found ${orderCount}`);
            if(String(draft.status).toLowerCase() !== 'complete') throw new Error(`Draft status is ${draft.status}, not complete`);
            if(!Array.isArray(picks) || picks.length === 0) throw new Error('Completed draft returned no picks');
            const snapshot = {
              league_id: LEAGUE,
              season: String(draft.season),
              draft_id: String(draft.draft_id),
              status: draft.status,
              teams: users.length,
              order_slots: orderCount,
              picks: picks.length,
              verified_at: new Date().toISOString()
            };
            fs.writeFileSync('public/sleeper-verified.json', JSON.stringify(snapshot,null,2)+'\n');
            console.log(`Sleeper verified: draft ${snapshot.draft_id} · ${snapshot.status} · ${snapshot.picks} picks · ${snapshot.teams}/12 teams · ${snapshot.order_slots}/12 slots`);
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE

      - name: Run 100-check QA gate
        run: node scripts/qa.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "${SITE_URL}home.html" -o /tmp/home.html && \
               curl -fsSL --max-time 20 "${SITE_URL}film-room.html" -o /tmp/film-room.html && \
               curl -fsSL --max-time 20 "${SITE_URL}draft-recap.html" -o /tmp/recap.html && \
               curl -fsSL --max-time 20 "${SITE_URL}sleeper-verified.json" -o /tmp/sleeper.json; then
              break
            fi
            sleep 2
          done
          grep -q 'ENTER SEASON HQ' /tmp/home.html
          grep -q 'VIEW LEADERBOARDS' /tmp/home.html
          grep -q 'film-room.html' /tmp/home.html
          if grep -q 'href="./draft-recap.html"' /tmp/home.html; then
            echo 'Post-draft recap is still promoted from homepage' >&2
            exit 1
          fi
          grep -q 'premiere.html' /tmp/film-room.html
          grep -q 'draft-recap.html' /tmp/film-room.html
          grep -q 'Opening Film' /tmp/film-room.html
          grep -q 'The Draft Is Closed' /tmp/film-room.html
          grep -q 'THE DRAFT' /tmp/recap.html
          grep -q 'video/mp4' /tmp/recap.html
          node -e "const s=require('/tmp/sleeper.json'); if(s.status!=='complete'||s.teams!==12||s.order_slots!==12||s.picks!==180) process.exit(1); console.log('Public site verified:', s)"
