name: Render Draft Reveal
on:
  workflow_dispatch:
  push:
    paths:
      - 'video/**'
      - 'package.json'
      - '!public/draft-reveal-2026.mp4'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture official Sleeper order
        run: npm run video:data
      - name: Compose original score
        run: npm run video:score
      - name: Render 24 Gridiron reveal
        run: npm run video:render
      - name: Publish finished MP4
        run: |
          git config user.name "24 Gridiron Studio"
          git config user.email "actions@users.noreply.github.com"
          git add public/draft-reveal-2026.mp4
          git commit -m "Publish 2026 draft reveal video" || exit 0
          git push
